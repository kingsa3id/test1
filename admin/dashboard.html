<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Administration</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 2rem; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background: #1e1e1e; padding: 1.5rem; border-radius: 10px; border: 1px solid #2a2a2a; }
        h3 { color: #d4af37; margin-top: 0; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #333; border-radius: 6px; background: #2a2a2a; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 10px 15px; background: #d4af37; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b89628; }
        .btn-danger { background: #ff4444; color: #fff; margin-left: 8px; padding: 6px 12px; font-size: 0.85rem; }
        .btn-danger:hover { background: #cc0000; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 14px; margin-bottom: 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Gérer le Studio Photo</h2>
        <div>
            <span id="currentUserEmail" style="margin-right: 15px; color: #aaa;"></span>
            <button onclick="logoutAdmin()" class="btn-danger">Déconnexion</button>
        </div>
    </div>

    <div class="grid">
        <!-- Manage Session Types -->
        <div class="card">
            <h3>Gérer les Types de Séance</h3>
            <form onsubmit="handleAddSessionType(event)">
                <input type="text" id="typeFr" placeholder="Nom en Français (ex: Mariage)" required>
                <input type="text" id="typeAr" placeholder="Nom en Arabe (ex: زفاف)" required>
                <button type="submit" style="width: 100%; margin-top: 8px;">+ Ajouter Type</button>
            </form>
            <h4 style="margin-top: 20px; color: #888;">Types Actuels:</h4>
            <ul id="sessionTypeList"></ul>
        </div>

        <!-- Manage Administrators -->
        <div class="card">
            <h3>Gérer les Administrateurs</h3>
            <form onsubmit="handleCreateUser(event)">
                <input type="email" id="newEmail" placeholder="Nouvel Email Admin" required>
                <input type="password" id="newPassword" placeholder="Mot de passe" required minlength="4">
                <button type="submit" style="width: 100%; margin-top: 8px;">Créer un Compte Admin</button>
            </form>
            <h4 style="margin-top: 20px; color: #888;">Équipe Admin:</h4>
            <ul id="adminList"></ul>
        </div>

        <!-- View Bookings -->
        <div class="card" style="grid-column: 1 / -1;">
            <h3>Réservations Reçues</h3>
            <ul id="bookingList"></ul>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        protectPage();
        renderAdminList();
        renderAdminSessionTypes();
        renderBookings();
    </script>
</body>
</html>
