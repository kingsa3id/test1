<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e1e1e; padding: 2.5rem; border-radius: 12px; width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2a2a2a; }
        h2 { text-align: center; margin-top: 0; color: #d4af37; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #333; border-radius: 6px; background: #2a2a2a; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4af37; }
        button { width: 100%; padding: 12px; background: #d4af37; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #b89628; }
        .error { color: #ff5555; font-size: 0.85rem; display: none; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Espace Admin</h2>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="loginEmail" placeholder="Adresse Email" required>
            <input type="password" id="loginPassword" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="errorMessage" class="error">Email ou mot de passe incorrect.</div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
